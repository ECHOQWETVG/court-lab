<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COURT LAB · 2K27 建模台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Chivo+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="mark">
        <b>COURT LAB</b>
        <span>2K27 MyPLAYER</span>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="top-actions">
        <button class="ghost" id="units" title="切换公制/英制">英制 ft/lb</button>
        <button class="ghost" id="lang">EN</button>
      </div>
    </header>
    <main class="layout">
      <aside class="card player-card" id="player-card"></aside>
      <section class="card panel" id="panel"></section>
    </main>
    <footer class="note">个人离线建模台。属性上限来自 Sherpa 客户端表。徽章等级为估算。不登录、不连 2K / Firebase。</footer>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
